# Structural placeholder — see backend/Dockerfile. Bringing this stack up
# for real (bundle installed image, migrations run) is Phase 1 work.
#
# `rails`/`sidekiq` bind-mount ./backend so the Codegen Agent's file
# writes are visible inside a container immediately, with no image
# rebuild between iterations. The agent runs one-off commands via
# `docker compose run --rm rails <command>` — it does not `up` the
# `rails` service itself, since its CMD expects a bundled, working app
# that doesn't exist yet at the start of a run.
#
# `bundle_cache` is a named volume (not a bind mount) for the gem install
# path (/usr/local/bundle) — `docker compose run --rm` gives each command
# a fresh, ephemeral container, so without this, gems installed by one
# `bundle install` call would vanish before the next command ran.
#
# No service publishes a host port: rails/sidekiq only need to reach
# mysql/mongo/redis by service name over the compose-internal network,
# never from the host. Publishing fixed host ports meant two projects'
# stacks could never run at the same time — the second one would fail to
# start with "port already allocated" the moment the first project's
# containers were still up (or left running from a prior CLI invocation).
services:
  rails:
    build: ./backend
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    depends_on:
      - mysql
      - mongo
      - redis
    environment:
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017/app_development

  sidekiq:
    build: ./backend
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      - redis
      - mysql
      - mongo
    environment:
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017/app_development

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: app_development

  mongo:
    image: mongo:7.0

  redis:
    image: redis:7

volumes:
  bundle_cache:
