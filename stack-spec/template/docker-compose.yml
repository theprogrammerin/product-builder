# `rails`/`sidekiq`/`frontend` bind-mount their own directory so the
# Codegen Agent's file writes are visible inside a container immediately,
# with no image rebuild between iterations. The agent runs one-off
# commands via `docker compose run --rm <service> <command>` — it does
# not `up` these services, since their CMD expects a bundled/installed,
# working app that doesn't exist yet at the start of a run.
#
# `bundle_cache`/`frontend_node_modules` are named volumes (not bind
# mounts) for each side's install path — `docker compose run --rm` gives
# each command a fresh, ephemeral container, so without these, packages
# installed by one `bundle install`/`npm install` call would vanish
# before the next command ran. See
# docs/designs/codegen-agent-milestone-1.md and
# docs/designs/frontend-generation.md.
#
# rails/frontend declare a host port via an env var placeholder
# (${RAILS_HOST_PORT}/${FRONTEND_HOST_PORT}), not a fixed number —
# `docker compose run --rm` (the Codegen Agent's own usage) doesn't
# publish a service's declared ports at all unless --service-ports is
# passed, so those calls are unaffected either way. Only `docker compose
# up -d` (the Run Agent — see docs/designs/run-deploy-agent.md) sets
# these per invocation, picking a free host port itself, so concurrently
# running projects still don't collide the way a fixed port would. The
# Run Agent also sets a `${<NAME>_URL}` (e.g. RAILS_URL, FRONTEND_URL)
# per component at the same time — see
# stack-spec/guidelines/component-networking.md — so any service can
# reference any other one's real, allocated URL, never a hardcoded
# localhost:<port>.
services:
  rails:
    build: ./backend
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    ports:
      - "${RAILS_HOST_PORT}:3000"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017/app_development
      # The frontend always runs on a different, dynamically-allocated
      # origin than this backend — CORS is required (see
      # config/initializers/cors.rb and
      # stack-spec/guidelines/component-networking.md). FRONTEND_URL is
      # provided by the Run Agent the same way RAILS_URL is below.
      FRONTEND_ORIGIN: "${FRONTEND_URL}"

  sidekiq:
    build: ./backend
    volumes:
      - ./backend:/app
      - bundle_cache:/usr/local/bundle
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    environment:
      MYSQL_HOST: mysql
      MONGO_URI: mongodb://mongo:27017/app_development

  # A plain `depends_on: [mysql]` only waits for the container to start,
  # not for MySQL itself to accept connections — `docker compose up -d`
  # returns as soon as the process launches, well before first-boot
  # initialization finishes. That race is real, not theoretical: the Run
  # Agent's migration step (docs/designs/run-deploy-agent.md) hit
  # "Can't connect to server on 'mysql' (115)" against a freshly started
  # container during live verification. The healthcheck + condition below
  # makes both `up -d` and `run --rm` actually wait for MySQL to be ready.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: app_development
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7.0

  redis:
    image: redis:7

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_HOST_PORT}:8081"
    environment:
      # Jest colorizes its summary line by default, which breaks a plain
      # string match on "Tests: ..." and adds noise to what the agent
      # itself sees in run_command output. CI=true alone didn't suppress
      # it here (neither did dropping the pseudo-TTY) — FORCE_COLOR=0 is
      # what chalk/supports-color (what Jest uses internally) actually
      # honors unconditionally. See docs/designs/frontend-generation.md.
      CI: "true"
      FORCE_COLOR: "0"
      # The Run Agent picks a fresh, unpredictable host port for `rails`
      # on every run — RAILS_URL is that run's actual full backend URL,
      # provided by the Run Agent the same way RAILS_HOST_PORT is above.
      # Without this, the frontend's API client falls back to its
      # hardcoded default (localhost:3000), which is only right by
      # coincidence. See stack-spec/guidelines/component-networking.md
      # and docs/backlog.md bug #12/feature #17.
      EXPO_PUBLIC_API_BASE_URL: "${RAILS_URL}/api/v1"

volumes:
  bundle_cache:
  frontend_node_modules:
